services:
  - type: web
    name: lowdata-call
    runtime: node
    plan: free
    buildCommand: echo "no build needed"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      # Relay (TURN) for mobile-data users. Fill these in the Render dashboard after the first deploy.
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
